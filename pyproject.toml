[project]
name = "marketmaster"
version = "0.2.0"
description = "AI-native market intelligence and quantitative trading platform"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "httpx>=0.28",
    "pandas>=2.2",
    "numpy>=2.1",
    "scikit-learn>=1.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
research = ["polars>=1.20", "scipy>=1.15", "statsmodels>=0.14", "yfinance>=0.2.50"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
