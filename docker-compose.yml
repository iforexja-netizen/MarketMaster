services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: marketmaster
      POSTGRES_USER: marketmaster
      POSTGRES_PASSWORD: marketmaster
    ports:
      - "5432:5432"
    volumes:
      - marketmaster_pg:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/mcei_series_map.sql:/docker-entrypoint-initdb.d/02-mcei-config.sql:ro
      - ./db/seed_universe.sql:/docker-entrypoint-initdb.d/03-seed-universe.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketmaster -d marketmaster"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn marketmaster.main:app --host 0.0.0.0 --port 8000

volumes:
  marketmaster_pg:
